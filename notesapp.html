<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #notes-container {
            width: 80%;
            margin: 40px auto;
            padding: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #notes-container h1 {
            text-align: center;
        }
        #notes-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #notes-list li {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        #notes-list li:last-child {
            border-bottom: none;
        }
        #new-note-form {
            margin-top: 20px;
        }
        #new-note-form input[type="text"] {
            width: 100%;
            height: 40px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
        }
        #new-note-form button {
            width: 100%;
            height: 40px;
            padding: 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #new-note-form button:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <div id="notes-container">
        <h1>Notes App</h1>
        <ul id="notes-list"></ul>
        <form id="new-note-form">
            <input type="text" id="new-note-input" placeholder="Enter a new note">
            <button id="add-note-btn">Add Note</button>
        </form>
    </div>

    <script>
        // Get the notes list and form elements
        const notesList = document.getElementById("notes-list");
        const newNoteForm = document.getElementById("new-note-form");
        const newNoteInput = document.getElementById("new-note-input");
        const addNoteBtn = document.getElementById("add-note-btn");

        // Initialize an empty array to store the notes
        let notes = [];

        // Function to add a new note
        function addNote(note) {
            // Create a new list item for the note
            const noteItem = document.createElement("li");
            noteItem.textContent = note;
            notesList.appendChild(noteItem);
            // Add the note to the notes array
            notes.push(note);
            // Clear the input field
            newNoteInput.value = "";
        }

        // Function to save the notes to local storage
        function saveNotes() {
            // Convert the notes array to a JSON string
            const notesJson = JSON.stringify(notes);
            // Save the JSON string to local storage
            localStorage.setItem("notes", notesJson);
        }

        // Function to load the notes from local storage
        function loadNotes() {
            // Get the saved notes JSON string from local storage
            const savedNotesJson = localStorage.getItem("notes");
            // If there are saved notes, parse the JSON string and load the notes
            if (savedNotesJson) {
                notes = JSON.parse(savedNotesJson);
                // Add each note to the notes list
                notes.forEach((note) => {
                    addNote(note);
                });
            }
        }

        // Add an event listener to the add note button
        addNoteBtn.addEventListener("click", (e) => {
            // Prevent the default form submission behavior
            e.preventDefault();
            // Get the new note text from the input field
            const newNoteText = newNoteInput.value.trim();
            // If the new note text is not empty, add the note
            if (newNoteText) {
                addNote(newNoteText);
                // Save the notes to local storage
                saveNotes();
            }
        });

        // Load the saved notes
        loadNotes();
    </script>
</body>
</html>
