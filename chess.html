		.chess-board {
			display: grid;
			grid-template-columns: repeat(8, 1fr);

		}
		.chess-board div {
			height: 50px;
			width: 50px;
			background-color: #CCCCCC;
			border: 1px solid #000000;
		}
		.chess-board div:hover {

		}
	</style>
</head>
