<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Player Chess</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 100px);
            grid-template-rows: repeat(8, 100px);
        }
        .square {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
        }
        .white {
            background-color: white;
        }
        .black {
            background-color: gray;
        }
    </style>
</head>
<body>
    <div id="chessboard"></div>
    <script>
        const board = document.getElementById('chessboard');
        const pieces = {
            'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔', 'p': '♙',
            'R': '♜', 'N': '♞', 'B': '♟', 'Q': '♛', 'K': '♚', 'P': '♟'
        };
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            ['.', '.', '.', '.', '.', '.', '.', '.'],
            ['.', '.', '.', '.', '.', '.', '.', '.'],
            ['.', '.', '.', '.', '.', '.', '.', '.'],
            ['.', '.', '.', '.', '.', '.', '.', '.'],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];

        let currentTurn = 'white';

function createBoard() {
            initialBoard.forEach((row, rowIndex) => {
                row.forEach((square, colIndex) => {
                    const div = document.createElement('div');
                    div.className = 'square ' + ((rowIndex + colIndex) % 2 === 0 ? 'white' : 'black');
                    div.innerHTML = pieces[square] || '';
                    board.appendChild(div);
                });
            });
        }

        createBoard();

        board.addEventListener('click', (event) => {
            const target = event.target;
            if (target.classList.contains('square')) {
                const selectedPiece = target.innerHTML;
                if (selectedPiece) {
                    alert('Selected: ' + selectedPiece);
                    function showPossibleMoves(rowIndex, colIndex, selectedPiece) {
                    const possibleMoves = {
                        'P': [[-1, 0], [-1, -1], [-1, 1]],
                        'p': [[1, 0], [1, -1], [1, 1]],
                        // Add other pieces' moves here
                    // Implement logic for other pieces' moves
                    // Implement logic for other pieces' moves
                    // Remove this line if you want to delete the previous changes
                    };
                    const moves = possibleMoves[selectedPiece];
                    if (moves) {
                        moves.forEach(move => {
                            const newRow = rowIndex + move[0];
                            const newCol = colIndex + move[1];
                            if (newRow >= 0 && newRow < 8 && newCol >= 0 && newCol < 8) {
                                // Highlight the possible move squares
                                const moveSquare = board.children[newRow * 8 + newCol];
                                moveSquare.style.backgroundColor = 'yellow';
                            }
                        });
                    }
                    // This is a placeholder for future implementation
                    showPossibleMoves(rowIndex, colIndex, selectedPiece);
                    currentTurn = currentTurn === 'white' ? 'black' : 'white';
                    alert('Turn: ' + currentTurn);
                };
                    // and switch turns
                }
            }
        });
    </script>
</body>
</html>
